// Idle agents wander to the lounge or a colleague's cubicle and back, keeping to the walkway and doors.
function walkTick() {
  const off = $('.office');
  if (!off || document.hidden || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const busy = off.querySelectorAll('.walker.go').length;
  const idle = [...off.querySelectorAll('.cube .ws.idle')];
  if (!idle.length || busy >= 2 || Math.random() < 0.35) return;
  const any = (a) => a[Math.floor(Math.random() * a.length)];
  const ws = any(idle), w = ws.querySelector('.walker');
  if (w.classList.contains('go')) return;
  const home = w.getBoundingClientRect(), hx = home.left + home.width / 2, hy = home.top + home.height / 2;
  const lane = off.querySelector('.crew').getBoundingClientRect().bottom - 32; // walkway centre, lines up with the doors
  const lounge = off.querySelector('.room.lounge'), others = [...off.querySelectorAll('.cube .ws')].filter((o) => o !== ws);
  let tx, ty, said, food;
  if (!others.length || (lounge && Math.random() < 0.6)) {
    const spots = [...lounge.querySelectorAll('[data-food]')];
    if (spots.length && Math.random() < 0.75) { // grab something from a stall or the vending machine
      const st = any(spots), r = st.getBoundingClientRect();
      food = st.dataset.food; tx = r.left + r.width / 2; ty = r.bottom + 14; said = food + '!';
    } else {
      const r = lounge.getBoundingClientRect();
      tx = r.left + 40 + Math.random() * (r.width - 80); ty = r.top + r.height / 2 + 64 + Math.random() * 8; said = 'coffee';
    }
  } else {
    const r = any(others).querySelector('.walker').getBoundingClientRect();
    tx = r.left + r.width / 2 + (Math.random() < 0.5 ? -30 : 30); ty = r.top + r.height / 2 + 8; said = 'hi!';
  }
  const ox = parseFloat(getComputedStyle(w).getPropertyValue('--ox')) || 0;
  let at = [hx, hy];
  const walk = (pts, done) => {
    if (!pts.length) { w.classList.remove('moving'); return done(); }
    const [[x, y], ...rest] = pts, dist = Math.hypot(x - at[0], y - at[1]);
    if (dist < 1) return walk(rest, done);
    const ms = Math.max(250, (dist / 55) * 1000);
    if (Math.abs(x - at[0]) > 1) w.style.setProperty('--f', x < at[0] ? -1 : 1);
    w.classList.add('moving');
    w.style.transitionDuration = ms + 'ms'; w.style.transitionTimingFunction = `steps(${Math.max(3, Math.round(dist / 6))})`;
    w.style.transform = `translate(${ox + x - hx}px,${y - hy}px)`;
    at = [x, y];
    setTimeout(() => walk(rest, done), ms + 30);
  };
  ws.classList.add('away'); w.classList.add('go');
  walk([[hx, lane], [tx, lane], [tx, ty]], () => {
    w.querySelector('.say').textContent = said; w.classList.add('at');
    setTimeout(() => {
      w.classList.remove('at');
      if (food) w.insertAdjacentHTML('beforeend', spr(food, 'carry'));
      walk([[tx, lane], [hx, lane], [hx, hy]], () => {
        w.classList.remove('go'); ws.classList.remove('away'); w.style.removeProperty('transform'); w.style.removeProperty('--f');
        if (!food) return;
        w.querySelector('.carry')?.remove(); ws.querySelector('.snack')?.remove();
        ws.insertAdjacentHTML('beforeend', spr(food, 'snack')); // eaten after a while
        const snack = ws.lastElementChild; setTimeout(() => snack.remove(), 20000);
      });
    }, 3000 + Math.random() * 3000);
  });
}

        : v.kind === 'binary' ? '<div class="card mute">Binary file, can\'t be shown.</div>'
        : isMd && !F.raw ? `<div class="msg doc">${md(v.content)}</div>` : `<pre class="code">${esc(v.content)}</pre>`;
      body = `<div class="bar"><button class="s back" onclick="closeFile()">← Back</button><b>${esc(v.name)}</b><span class="mute">${fsize(v.size)}</span>${v.mtime ? `<span class="mute" title="${esc(new Date(v.mtime).toLocaleString())}">· updated ${esc(ago(v.mtime))}</span>` : ''}<span class="sp"></span>${toggle}</div>${v.truncated ? '<div class="mute" style="margin-bottom:6px">Showing the first 512 KB.</div>' : ''}${content}`;
    }
    if (F.err) body = `<div class="card failed">${esc(F.err)}</div>`;
    return `<div class="files ${F.file ? 'open' : ''}"><div class="flist-wrap"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Files</h3><button class="s" onclick="refreshFiles()">Refresh</button></div>${crumbs}${gitCard(F.git)}<div class="card flist" style="padding:6px">${rows}</div></div><div class="fv">${body}</div></div>`;
  },
  Team() {
    const byTeam = {};
    S.agents.forEach((a) => (byTeam[a.team] ??= []).push(a));
    const roster = S.agents.length
      ? Object.entries(byTeam).map(([t, as]) => `<h2>${esc(t)}</h2><table class="rt roster"><colgroup><col class="c-name"><col class="c-title"><col class="c-job"><col class="c-model"><col class="c-skills"><col class="c-now"><col class="c-act"></colgroup><tr><th>Name</th><th>Title</th><th>Job</th><th>Model</th><th>Skills</th><th>Now</th><th></th></tr>${as.map((a) => {
          const cur = S.tasks.find((x) => x.agentId === a.id && x.status === 'running');
          return `<tr><td><div class="nmcell">${avatar(a.id, 'sm')}<b>${esc(a.name)}</b></div>${a.kind === 'manager' ? ' <span class="pill">manager</span>' : ''}</td><td>${esc(a.title)}</td><td class="mute"><div class="job" title="${esc(a.jobDescription)}">${esc(a.jobDescription)}</div></td><td>${modelSelect(`class="mdl" aria-label="Model for ${esc(a.name)}" onchange="setAgentModel('${a.id}', this.value)"`, agentModelOf(a))}${S.settings?.provider === 'claude' ? `<label class="mute" style="display:flex;gap:5px;align-items:center;margin-top:5px" title="Lets this agent open localhost pages in your Chrome (Claude in Chrome extension) to test the app"><input type="checkbox" ${a.browser ? 'checked' : ''} onchange="api('PATCH', '/api/agents/${a.id}', { browser: this.checked })">Chrome access</label>` : ''}</td><td class="skcol">${skillsCell(a)}</td><td>${cur ? esc(cur.title) : '<span class="mute">idle</span>'}</td><td><button class="s" onclick="fire('${a.id}')">Fire</button></td></tr>`;
        }).join('')}</table>`).join('')
      : '<div class="card mute">Nobody hired yet.</div>';
    const bossCard = `<div class="card"><div class="row"><b>Boss model</b>${modelSelect('aria-label="Boss model" onchange="setBossModel(this.value)"', (S.settings?.provider !== 'claude' ? S.settings?.bossOpenaiModel : S.settings?.bossModel) || '')}<span class="mute">Cheaper models (Haiku, Sonnet) cost far less for routing and simple work. Applies to the next run. Models shown are for the provider chosen in Settings (${S.settings?.provider === 'openai' ? 'OpenAI' : 'Claude'}).</span></div></div>`;
    return `${bossCard}<div class="card"><b>Hire an agent</b>
      <div class="grid" style="margin-top:8px"><input id="hName" placeholder="Name (optional)" value="${val('hName')}"><input id="hTitle" placeholder="Title, e.g. QA Engineer" value="${val('hTitle')}"></div>
      <textarea id="hJob" rows="2" placeholder="Job description: what this agent is responsible for" style="margin:8px 0">${val('hJob')}</textarea>
      <div class="row"><select id="hTeam"><option value="">Team (auto)</option>${['Sales','Marketing','Engineering','QA','Product','Release','Legal','Other'].map((t) => `<option ${drafts.hTeam === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="hKind"><option value="">Role: auto</option><option value="worker" ${drafts.hKind === 'worker' ? 'selected' : ''}>Worker</option><option value="manager" ${drafts.hKind === 'manager' ? 'selected' : ''}>Manager (plans &amp; routes)</option></select>
      ${modelSelect('id="hModel" onchange="drafts.hModel = this.value"', drafts.hModel || '')}
      <button class="b" onclick="hire()">Hire</button></div>
      ${S.agents.length ? '' : '<p><button class="s" onclick="api(\'POST\',\'/api/agents/starter\')">+ Hire starter office (Manager, Release, Sales, Marketing, Dev, QA, Product, Legal)</button></p>'}
    </div>${roster}`;
  },
  Tasks() {
    if (!S.tasks.length) return '<div class="card mute">No tasks yet. Ask the Boss for something.</div>';
    return `<table class="rt"><tr><th>Agent</th><th>Task</th><th>Status</th><th>Cost</th><th></th></tr>${[...S.tasks].reverse().map((t) => `<tr><td>${esc(name(t.agentId))}</td><td><b>${esc(t.title)}</b>${t.dependsOn?.length ? `<div class="mute">after: ${t.dependsOn.map((d) => esc(S.tasks.find((x) => x.id === d)?.title ?? '?')).join(', ')}</div>` : ''}${t.result ? `<div class="mute" style="white-space:pre-wrap">${esc(t.result)}</div>` : ''}${t.error ? `<div class="failed">${esc(t.error)}</div>` : ''}</td><td class="${t.status}">${t.status.replace('_', ' ')}</td><td class="mute">$${t.costUsd.toFixed(3)}</td><td>${['blocked','queued','running','waiting_input'].includes(t.status) ? `<button class="s" onclick="api('POST','/api/tasks/${t.id}/cancel')">Cancel</button>` : ['failed','cancelled'].includes(t.status) ? `<button class="s" onclick="api('POST','/api/tasks/${t.id}/retry')">Retry</button>` : ''}</td></tr>`).join('')}</table>`;
  },
  Usage() {
    const runs = [...(S.usage?.runs || [])].reverse();
    const totals = (role) => {
      const rows = runs.filter((r) => r.role === role);
      return `${rows.length} runs · ${tok(rows.reduce((n, r) => n + r.inputTokens, 0))} in · ${tok(rows.reduce((n, r) => n + r.outputTokens, 0))} out`;
    };
    const sum = (k) => runs.reduce((n, r) => n + (r[k] || 0), 0);
    const sumRow = runs.length ? `<tr data-fixed="1" style="font-weight:700"><td>Total</td><td>${runs.length} runs</td><td></td><td></td><td>${tok(sum('inputTokens'))}</td><td>${tok(sum('outputTokens'))}</td><td>${tok(sum('cacheReadTokens'))}</td><td>${tok(sum('cacheCreationTokens'))}</td><td>${runs.filter((r) => r.compactionObserved).length} observed</td><td>${(sum('durationMs') / 1000).toFixed(1)}s</td><td>${money(sum('costUsd'))}</td></tr>` : '';
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Run usage</h2><button class="s" onclick="resetUsage()" title="Clears the usage totals and run log for this session">Reset usage</button></div><p>Boss: ${totals('boss')}<br>Workers: ${totals('worker')}</p><p class="mute">This log starts with runs made after this update and keeps the latest 200. “Not reported” means the CLI gave no compaction event; it does not prove no compaction occurred. Token figures come from the CLIs. Codex does not report a dollar cost here.</p></div>${runs.length ? `<div class="card" style="overflow-x:auto"><table class="rt"><tr><th>When</th><th>Run</th><th>Provider / model</th><th>Mode</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th><th>Compaction</th><th>Time</th><th>Cost</th></tr>${sumRow}${runs.map((r) => `<tr><td>${esc(new Date(r.at).toLocaleString())}</td><td><b>${r.role === 'boss' ? 'Boss' : esc(name(r.agentId))}</b>${r.taskId ? `<br><span class="mute">${esc(S.tasks.find((t) => t.id === r.taskId)?.title || r.taskId)}</span>` : ''}${r.ok ? '' : '<br><span class="failed">failed</span>'}</td><td>${esc(r.provider)}<br><span class="mute">${esc(r.model)}</span></td><td>${r.resumed ? 'resumed' : 'fresh'}</td><td>${tok(r.inputTokens)}</td><td>${tok(r.outputTokens)}</td><td>${r.cacheReadTokens == null ? '—' : tok(r.cacheReadTokens)}</td><td>${r.cacheCreationTokens == null ? '—' : tok(r.cacheCreationTokens)}</td><td>${r.compactionObserved ? 'observed' : 'not reported'}</td><td>${(r.durationMs / 1000).toFixed(1)}s</td><td>${money(r.costUsd)}</td></tr>`).join('')}</table></div>` : '<div class="card mute">No new runs recorded yet.</div>'}`;
  },
  Inbox() {
    const qs = [...S.questions].reverse();
    if (!qs.length) return '<div class="card mute">Nothing needs you. Anything the Boss or an agent needs from you shows up here.</div>';
    return qs.map((q) => questionItem(q)).join('');
  },
  Skills() {
    if (!skills) return '<div class="mute">Loading…</div>';
    return `<p class="mute">${skills.length} skills available to Claude on this machine.</p><input id="skQ" placeholder="Filter…" value="${val('skQ')}" style="margin-bottom:8px">
      <table class="rt"><tr><th>Skill</th><th>Source</th><th>Description</th></tr>${skills.filter((s) => (s.name + s.description).toLowerCase().includes((drafts.skQ || '').toLowerCase())).map((s) => `<tr><td><b>${esc(s.name)}</b></td><td class="mute">${esc(s.source)}</td><td class="mute">${esc(s.description.slice(0, 220))}</td></tr>`).join('')}</table>`;
  },
  Settings() {
    const s = S.settings || { provider: 'claude' };
    const sessionName = (S.sessions || []).find((x) => x.id === S.activeSessionId)?.name || 'Original session';
    return `<div class="card" style="max-width:650px"><h2>Agent provider · ${esc(sessionName)}</h2><p class="mute">Belongs to this session. Its Boss and hired agents use this provider for new runs; active runs finish with the provider they started with. Pick models for the Boss and each agent on the Team tab.</p>
      <label for="sProvider">Provider</label><select id="sProvider" onchange="setProvider(this.value)" style="display:block;margin:8px 0 0;width:100%"><option value="claude" ${s.provider === 'claude' ? 'selected' : ''}>Claude CLI</option><option value="openai" ${s.provider === 'openai' ? 'selected' : ''}>OpenAI (Codex CLI)</option><option value="azure" ${s.provider === 'azure' ? 'selected' : ''}>Microsoft Foundry (Azure OpenAI)</option></select></div>${s.provider === 'azure' ? foundryCard() : ''}`;
  },
};

function foundryCard() {
  const a = S.azure || {};
  const d = (id, v) => drafts[id] ?? v ?? '';
  return `<div class="card" style="max-width:650px"><h2>Microsoft Foundry (Azure OpenAI)</h2>
    <p class="mute">Runs the Boss and agents on your Azure OpenAI deployment through the Codex CLI. The key is saved on this computer only (data/azure.json, owner-readable) and is never shown again.</p>
    <label for="azEndpoint">Endpoint</label><input id="azEndpoint" placeholder="https://&lt;your-resource&gt;.openai.azure.com/" value="${esc(d('azEndpoint', a.endpoint))}" style="display:block;width:100%;margin:6px 0 10px" autocomplete="off">
    <label for="azKey">API key</label><input id="azKey" type="password" placeholder="${a.keySet ? 'Saved. Leave blank to keep it' : 'Paste your API key'}" value="${esc(drafts.azKey ?? '')}" style="display:block;width:100%;margin:6px 0 10px" autocomplete="off">
    <label for="azDeployment">Deployment name</label><input id="azDeployment" placeholder="gpt-5-mini" value="${esc(d('azDeployment', a.deployment))}" style="display:block;width:100%;margin:6px 0 10px" autocomplete="off">
    <div class="row"><button class="b" onclick="saveAzure()">Save</button><span class="mute" id="azMsg">${a.keySet ? 'Connected settings saved.' : 'Not configured yet.'}</span></div></div>`;
}
async function saveAzure() {
  const msg = (t, bad) => { const el = $('#azMsg'); if (el) { el.textContent = t; el.style.color = bad ? 'var(--bad)' : ''; } };
  try {
    const r = await fetch('/api/azure', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: $('#azEndpoint').value, apiKey: $('#azKey').value, deployment: $('#azDeployment').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return msg(j.error || r.statusText, true);
    delete drafts.azKey; delete drafts.azEndpoint; delete drafts.azDeployment;
    S.azure = j; const k = $('#azKey'); if (k) k.value = ''; msg('Saved.');
  } catch (e) { msg(e.message, true); }
}

const gitBadge = (g) => `<span class="gb" title="git: ${esc(g.branch)}${g.total ? ', ' + g.total + ' changed' : ', clean'}">⎇ ${esc(g.branch)}${g.ahead ? ' ↑' + g.ahead : ''}${g.behind ? ' ↓' + g.behind : ''} <b class="${g.total ? 'dirty' : 'clean'}">${g.total ? '● ' + g.total : '✓'}</b></span>`;
function gitCard(g) {
  if (!g) return '';
  const rows = g.changes.map((c) => `<div class="gr"><code>${esc(c.slice(0, 2))}</code> ${esc(c.slice(3))}</div>`).join('');
  return `<div class="card gitcard"><h3 style="margin:0 0 6px">Git</h3>${gitBadge(g)}${g.total ? `<div class="grs">${rows}${g.total > g.changes.length ? `<div class="mute">…and ${g.total - g.changes.length} more</div>` : ''}</div>` : '<div class="mute" style="margin-top:6px">Working tree clean.</div>'}</div>`;
}
const fsize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B');
function renderFiles() { F.dirty = true; render(); }
async function fget(url) {
  const r = await fetch(sessionUrl(url)); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function loadDir(path) {
  try { const j = await fget('/api/files?path=' + encodeURIComponent(path || '')); F.dir = j.path; F.entries = j.entries; F.git = j.git || null; F.err = ''; }
  catch (e) { F.err = e.message; F.entries = F.entries || []; }
  renderFiles();
}
async function openFile(path) {
  F.file = path; F.view = null; F.err = ''; renderFiles();
  try { F.view = await fget('/api/file?path=' + encodeURIComponent(path)); } catch (e) { F.err = e.message; }
  renderFiles();
}
function closeFile() { F.file = null; F.view = null; F.err = ''; renderFiles(); }
async function refreshFiles() { const f = F.file; await loadDir(F.dir); if (f) await openFile(f); }
async function send() {
  const text = (drafts.chatIn || '').trim(); if (!text) return;
  drafts.chatIn = ''; render();
  await api('POST', '/api/chat', { text });
}
async function hire() {
  const r = await api('POST', '/api/agents', { name: drafts.hName, title: drafts.hTitle, jobDescription: drafts.hJob, team: drafts.hTeam, kind: drafts.hKind || undefined, model: drafts.hModel || '' });
  if (r.id) ['hName', 'hTitle', 'hJob', 'hTeam', 'hKind', 'hModel'].forEach((k) => delete drafts[k]);
  render();
}
async function setProvider(provider) {
  const r = await api('POST', '/api/settings', { provider });
  if (r.provider) { delete drafts.hModel; S.settings = r; render(); }
}
async function fire(id) { if (confirm('Fire this agent? Their open tasks are cancelled.')) await api('DELETE', '/api/agents/' + id); }
async function answer(id) { const a = drafts['ans_' + id]; if (a?.trim()) { await api('POST', `/api/questions/${id}/answer`, { answer: a }); delete drafts['ans_' + id]; } }

// ---- workspace picker (separate from render() so live updates don't wipe it) ----
function openSessions() {
  let p = $('#wsPanel'); if (!p) { p = document.createElement('div'); p.id = 'wsPanel'; document.body.appendChild(p); }
  const rows = (S.sessions || []).map((s) => `<button class="session-option" data-sid="${esc(s.id)}" ${s.id === S.activeSessionId ? 'disabled' : ''}><span class="session-title"><span>${esc(s.name)}</span>${s.id === S.activeSessionId ? '<span class="session-current">Current</span>' : ''}</span><span class="session-path">${esc(s.workspace)}</span><span class="session-meta">${providerName(s.provider)} · ${s.agents} agents · ${s.tasks} tasks</span></button>`).join('');
  p.innerHTML = `<div class="card session-panel"><div class="session-intro"><b>Sessions</b><div class="mute">Each session keeps its own agents, chat, tasks, Inbox and provider settings.</div></div><div class="session-list">${rows}</div><div class="session-footer"><button class="s" onclick="closeWs()">Close</button><button class="b" id="newSessionButton">+ New session</button></div></div>`;
  p.querySelectorAll('[data-sid]').forEach((el) => (el.onclick = () => selectSession(el.dataset.sid)));
  p.querySelector('#newSessionButton').onclick = newSession;
  p.onclick = (e) => { if (e.target === p) closeWs(); };
}
async function selectSession(id) { const j = await api('POST', `/api/sessions/${encodeURIComponent(id)}/select`); if (j.id) switchSession(id); }
async function newSession() { wsMode = 'new'; await browseWs(S.workspace); }
async function openWs() { wsMode = 'change'; await browseWs(S.workspace); }
async function browseWs(path) {
  const r = await fetch(sessionUrl('/api/fs?path=' + encodeURIComponent(path || ''))); const j = await r.json();
  if (!r.ok) return alert(j.error);
  ws = j; drawWs();
}
function drawWs() {
  let p = $('#wsPanel'); if (!p) { p = document.createElement('div'); p.id = 'wsPanel'; document.body.appendChild(p); }
  const recent = [...new Set([...(S.sessions || []).map((s) => s.workspace), ...(S.recentWorkspaces || [])])].filter((x) => x !== ws.path);
  p.innerHTML = `<div class="card"><b>${wsMode === 'new' ? 'New session' : 'Choose workspace'}</b><div class="mute">${wsMode === 'new' ? 'Choose an existing folder. This session starts with its own empty chat, team and tasks.' : 'Agents run in this folder. Running tasks finish where they started.'}</div>
    ${wsMode === 'new' ? `<input id="sessionName" placeholder="Session name (optional)" value="${esc(drafts.sessionName ?? '')}" style="margin-top:8px">` : ''}
    <div class="row" style="margin-top:8px"><input id="wsPath" value="${esc(ws.path)}" onkeydown="if(event.key==='Enter')browseWs(this.value)"><button class="s" onclick="browseWs($('#wsPath').value)">Go</button></div>
    <div class="dirs">${ws.parent ? `<div data-p="${esc(ws.parent)}">${icon('up')} ..</div>` : ''}${ws.dirs.map((d) => `<div data-p="${esc(ws.path.replace(/\/$/, '') + '/' + d)}">${icon('folder')} ${esc(d)}</div>`).join('') || '<div class="mute">No subfolders</div>'}</div>
    ${recent.length ? `<div class="mute">Recent: ${recent.map((x) => `<a href="#" data-use="${esc(x)}">${esc(x)}</a>`).join(' · ')}</div>` : ''}
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="s" onclick="closeWs()">Cancel</button><button class="b" id="confirmWs">${wsMode === 'new' ? 'Create session' : 'Use this folder'}</button></div></div>`;
  p.querySelector('#confirmWs').onclick = () => wsMode === 'new' ? createSession($('#wsPath').value) : useWs($('#wsPath').value);
  p.querySelectorAll('[data-p]').forEach((el) => (el.onclick = () => browseWs(el.dataset.p)));
  p.querySelectorAll('[data-use]').forEach((el) => (el.onclick = (e) => { e.preventDefault(); wsMode === 'new' ? browseWs(el.dataset.use) : useWs(el.dataset.use); }));
  p.onclick = (e) => { if (e.target === p) closeWs(); };
}
function closeWs() { $('#wsPanel')?.remove(); }
async function useWs(path) { const j = await api('POST', '/api/workspace', { path }); if (j.path) closeWs(); }
async function createSession(path) { const j = await api('POST', '/api/sessions', { workspace: path, name: $('#sessionName').value }); if (j.id) { delete drafts.sessionName; switchSession(j.id); } }

const elapsed = (iso) => { const sec = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)); return sec >= 3600 ? Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm' : sec >= 60 ? Math.floor(sec / 60) + 'm ' + (sec % 60) + 's' : sec + 's'; };
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function tick() { document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = el.dataset.since ? elapsed(el.dataset.since) : ''; }); }
setInterval(tick, 1000);
$('#usage').onclick = () => go('Usage');
setInterval(() => { $('#usage').innerHTML = usageHtml(); }, 30000);
let es;
function connectEvents() {
  es?.close();
  es = new EventSource(sessionUrl('/api/events'));
  es.onerror = () => fetch('/api/access').then((r) => { if (r.status === 401) location.reload(); }).catch(() => {});
  es.onmessage = (e) => {
    const next = JSON.parse(e.data);
    if (sessionId && next.activeSessionId !== sessionId) return;
    if (!sessionId) {
      sessionId = next.activeSessionId;
      try { sessionStorage.setItem('officeSessionId', sessionId); } catch {}
      connectEvents();
    }
    S = next;
    render();
  };
}
function switchSession(id) {
  if (id === sessionId) return closeWs();
  sessionId = id;
  try { sessionStorage.setItem('officeSessionId', id); } catch {}
  for (const k of Object.keys(drafts)) delete drafts[k];
  F.dirty = true;
  tab = 'Boss'; location.hash = 'Boss';
  closeWs();
  connectEvents();
}
connectEvents();
if (tab === 'Skills') loadSkills();
if (tab === 'Settings') loadModels();
$('#logo').innerHTML = icon('office');
render();
</script>
<script type="module" src="office3d.js" onerror="office3dFailed = true; render()"></script>
</body>
</html>
